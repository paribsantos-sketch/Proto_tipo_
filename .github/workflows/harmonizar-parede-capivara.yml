name: Harmonizar parede dos quatro modos da capivara
on:
  push:
    paths:
      - '.github/workflows/harmonizar-parede-capivara.yml'
permissions:
  contents: write
jobs:
  harmonizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir tonalidade superior sem alterar cenarios do computador
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='pb-cap-wall-tone-v2-20261127'
          if marker not in s:
            css='''<style id="pb-cap-wall-tone-v2-20261127">
          @media(max-width:800px){
            /* A parede ilustrada e #fcdbb8; eliminar a faixa superior mais clara */
            #pomodoro .pb-room[data-pb-cap-test="1"],
            #games .pb-room[data-pb-cap-test="1"]{
              background-color:#fcdbb8!important;
            }
            #pomodoro .pb-room[data-pb-cap-test="1"]::after,
            #games .pb-room[data-pb-cap-test="1"]::after{
              content:""!important;
              position:absolute!important;
              top:0!important;left:0!important;right:0!important;
              height:clamp(125px,17dvh,215px)!important;
              background:linear-gradient(to bottom,#fcdbb8 0%,#fcdbb8 56%,rgba(252,219,184,.75) 78%,rgba(252,219,184,0) 100%)!important;
              pointer-events:none!important;
              z-index:0!important;
            }
            #pomodoro .pb-room[data-pb-cap-test="1"] .pb-room-top,
            #games .pb-room[data-pb-cap-test="1"] .pb-room-top{
              position:relative!important;z-index:3!important;
            }
            #pomodoro .pb-room[data-pb-cap-test="1"] .pb-ring,
            #games .pb-room[data-pb-cap-test="1"] .pb-ring,
            #pomodoro .pb-room[data-pb-cap-test="1"] .pb-room-actions,
            #games .pb-room[data-pb-cap-test="1"] .pb-room-actions{
              position:relative!important;z-index:2!important;
            }
            /* Ajuste moderado de escala, mantendo o mascote legivel */
            #pomodoro .pb-room[data-pb-cap-test="1"] .pb-room-art,
            #games .pb-room[data-pb-cap-test="1"] .pb-room-art{
              width:min(78%,340px)!important;
              max-width:340px!important;
              object-fit:contain!important;
              object-position:center bottom!important;
            }
          }
          </style>'''
            if '</body>' not in s:raise RuntimeError('index.html sem fechamento body')
            s=s.replace('</body>',css+'</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Uniformizar cor da parede da capivara nos quatro modos mobile"
          git push
