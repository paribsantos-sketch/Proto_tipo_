name: Harmonizar parede dos quatro modos da capivara
on:
  push:
    paths:
      - '.github/workflows/harmonizar-parede-capivara.yml'
permissions:
  contents: write
jobs:
  harmonizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir tonalidade superior sem alterar cenarios do computador
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='pb-cap-full-image-mobile-v4-20261127'
          if marker not in s:
            css='''<style id="pb-cap-full-image-mobile-v4-20261127">
          @media(max-width:800px){
            /* A imagem mobile inteira ocupa o cenário: nenhuma faixa pintada. */
            #pomodoro .pb-room[data-pb-cap-test="1"],
            #games .pb-room[data-pb-cap-test="1"]{
              background-color:#FED6B2!important;
              background-image:var(--room-mobile,var(--room))!important;
              background-size:100% 100%!important;
              background-position:center center!important;
              background-repeat:no-repeat!important;
              isolation:isolate!important;
            }
            #pomodoro .pb-room[data-pb-cap-test="1"]::before,
            #games .pb-room[data-pb-cap-test="1"]::before,
            #pomodoro .pb-room[data-pb-cap-test="1"]::after,
            #games .pb-room[data-pb-cap-test="1"]::after{
              display:none!important;
              content:none!important;
            }
            #pomodoro .pb-room[data-pb-cap-test="1"] > *,
            #games .pb-room[data-pb-cap-test="1"] > *{
              position:relative!important;
              z-index:1!important;
            }
          }
          </style>'''
            if '</body>' not in s:raise RuntimeError('index.html sem fechamento body')
            s=s.replace('</body>',css+'</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Usar fundo mobile completo sem faixa de cor artificial"
          git push
