name: Harmonizar parede dos quatro modos da capivara
on:
  push:
    paths:
      - '.github/workflows/harmonizar-parede-capivara.yml'
permissions:
  contents: write
jobs:
  harmonizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir tonalidade superior sem alterar cenarios do computador
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='pb-cap-side-wall-match-v5-20261127'
          if marker not in s:
            css='''<style id="pb-cap-side-wall-match-v5-20261127">
          @media(max-width:800px){
            /* A faixa central da parede e a referencia; corrigir so as laterais. */
            :is(#pomodoro,#games) .pb-room[data-pb-cap-test="1"]::after{
              display:block!important;
              content:""!important;
              position:absolute!important;
              left:0!important;right:0!important;top:0!important;
              height:clamp(175px,26dvh,245px)!important;
              background:linear-gradient(to right,
                #FED6B2 0%,#FED6B2 27%,
                rgba(254,214,178,.5) 30%,
                transparent 34%,transparent 66%,
                rgba(254,214,178,.5) 70%,
                #FED6B2 73%,#FED6B2 100%)!important;
              -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 72%,transparent 100%)!important;
              mask-image:linear-gradient(to bottom,#000 0%,#000 72%,transparent 100%)!important;
              pointer-events:none!important;
              z-index:0!important;
            }
            :is(#pomodoro,#games) .pb-room[data-pb-cap-test="1"] > *{
              position:relative!important;
              z-index:1!important;
            }
          }
          </style>'''
            if '</body>' not in s:raise RuntimeError('index.html sem fechamento body')
            s=s.replace('</body>',css+'</body>',1)
            p.write_text(s,encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Harmonizar somente as laterais superiores com o tom central"
          git push
